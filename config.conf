    # Webserv Configuration File

# First server configuration
server {
    listen 8080;                  # Port to listen on
    host 127.0.0.1;               # Host address
    server_name example.com;      # Server name
    
    client_max_body_size 10M;     # Maximum allowed size for client request bodies
    
    error_page 404 /error/404.html;
    error_page 500 /error/500.html;
    error_page 403 /error/403.html;
    
    # Root route
    location / {

        root /var/www/html;       # Document root directory
        index index.html;         # Default file to serve
        allowed_methods GET POST;  # Allowed HTTP methods
        autoindex off;            # Disable directory listing
    }
    
    # Static files route
    location /static {
        root /var/www/static;
        index index.html;
        allowed_methods GET;
        autoindex on;             # Enable directory listing
    }
    
    # Redirection example
    location /old_page {
        redirect 301 /new_page;   # HTTP redirect
    }
    
    # CGI route for PHP
    location *.php {
        root /var/www/php;
        allowed_methods GET POST;
        cgi_pass /usr/bin/php-cgi;
        cgi_extension .php;
    }
    
    # CGI route for Python
    location *.py {
        root /var/www/python;
        allowed_methods GET POST;
        cgi_pass /usr/bin/python3;
        cgi_extension .py;
    }
    
    # Upload route
    location /upload {
        root /var/www/uploads;
        allowed_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
        upload_store /var/www/uploads/files;
    }
}

# Second server on the same port (virtual hosting)
server {
    listen 8080;
    host 127.0.0.1;
    server_name another-example.com;
    
    client_max_body_size 20M;
    
    error_page 404 /custom_404.html;
    
    location / {
        root /var/www/another-site;
        index index.html;
        allowed_methods GET;
        autoindex off;
    }
}

# Server on a different port
server {
    listen 8081;
    host 127.0.0.1;
    server_name admin.example.com;
    
    client_max_body_size 5M;
    
    location / {
        root /var/www/admin;
        index admin.html;
        allowed_methods GET POST DELETE;
        autoindex off;
    }
}