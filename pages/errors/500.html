<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 md:p-12 text-center max-w-md w-full">
        <h1 class="text-6xl md:text-7xl font-extrabold text-red-600 mb-4">500</h1>
        <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Internal Server Error</h2>
        <p class="text-lg text-gray-600 mb-8">
            Something went wrong on our end. We're working to fix it. Please try again later.
        </p>
        <a href="/" class="inline-block bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
            Go to Homepage
        </a>
    </div>
</body>
</html>
