<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>413 - Payload Too Large</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Using the dark theme from the previous examples to maintain consistency */
            background-color: #111827; /* gray-900 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">
    <div class="bg-gray-800 rounded-xl shadow-2xl p-8 md:p-12 text-center max-w-md w-full">
        <h1 class="text-6xl md:text-7xl font-extrabold text-red-500 mb-4">413</h1>
        <h2 class="text-3xl md:text-4xl font-bold text-gray-100 mb-4">Payload Too Large</h2>
        <p class="text-lg text-gray-400 mb-8">
            Sorry, the file you are trying to upload is too large. Please try again with a smaller file.
        </p>
        <a href="/upload.html" class="inline-block bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
            Try Again
        </a>
        <a href="/" class="mt-4 inline-block text-cyan-400 hover:text-cyan-300 transition duration-300">
            Go to Homepage
        </a>
    </div>
</body>
</html>
