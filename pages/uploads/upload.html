<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload - Webserv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Basic styling for the file input */
        input[type="file"]::file-selector-button {
            background-color: #0e7490; /* cyan-700 */
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #155e75; /* cyan-800 */
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="max-w-xl w-full mx-auto p-8 rounded-lg shadow-2xl bg-gray-800">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">File Upload</h1>
            <p class="text-lg text-gray-400">Test the POST method.</p>
        </header>

        <main>
            <!-- The action attribute should point to the location your server is configured to handle uploads -->
            <form action="/uploads" method="post" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label for="file-upload" class="block mb-2 text-sm font-medium text-gray-300">Choose a file to upload:</label>
                    <input type="file" name="fileUpload" id="file-upload" class="block w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-700 cursor-pointer">
                </div>
                
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-cyan-500">
                    Upload File
                </button>
            </form>
        </main>

        <footer class="mt-8 text-center">
            <a href="/" class="text-cyan-400 hover:text-cyan-300 transition duration-300">&larr; Back to Home</a>
        </footer>
    </div>
</body>
</html>
