<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Demo - Webserv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="text-center max-w-2xl mx-auto p-8">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-cyan-400 mb-2">Video Demo</h1>
            <p class="text-lg text-gray-400">Enjoy this sample video served by Webserv!</p>
        </header>
        <main>
            <video controls class="mx-auto rounded-lg shadow-lg w-full max-w-xl bg-black">
                <source src="/video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="mt-6">
                <a href="/" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-5 rounded-lg transition duration-300 ease-in-out transform hover:scale-105">
                    Back to Home
                </a>
            </div>
        </main>
        <footer class="mt-12 text-gray-500">
            <p>&copy; 2025 - A Webserv Project Demonstration</p>
        </footer>
    </div>
</body>
</html>
