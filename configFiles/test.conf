server {
    listen 8080;
    host 127.0.0.1;

    location / {
        root ./pages/;
        index index.html;
    }

    location ~ \.bla$ {
        root ./pages/cgi/;
        autoindex off;
        limit_except POST {
            deny all;
        }
        cgi_pass /usr/bin/cgi_test; # Ensure this directive is supported by your server
    }
}