server {
    listen 8080;
    host 127.0.0.1;


    client_max_body_size 1mb;


    location / {
     root ./pages/;
     index  index.html;
     allowed_methods GET POST;
     autoindex off;
    }


    location /chunked {
     root ./toTest/;
     index  index.html;
     allowed_methods GET POST;
     autoindex off;
    }

    

     location /upload{
        root ./pages/uploads/;
        allowed_methods GET POST ;
        autoindex on;
    }

     location /files/{
        root ./pages/uploads/;
        allowed_methods GET  ;
        autoindex on;
    }

     location /tmp-to-delete.txt{
        root ./tmp-to-delete.txt;
        allowed_methods GET DELETE ;
        autoindex on;
    }

      location /big {
        root ./;
        allowed_methods POST  ;
        autoindex on;
    }


     location *.py {
        root /var/www/cgi-bin;
        allowed_methods GET POST;
        cgi_pass /usr/bin/php-cgi;
    }

}